<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masader</title>
<style>
  :root { --ink:#1d2433; --muted:#5b6475; --line:#d9dde5; --accent:#2457a6; }
  body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); max-width: 760px; margin: 0 auto; padding: 24px 16px; }
  h1 { margin: 0 0 4px; } .muted { color: var(--muted); font-size: .9rem; }
  label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: .9rem; }
  input, textarea, select { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  .row { display: flex; gap: 12px; } .row > div { flex: 1; }
  button { margin-top: 16px; padding: 9px 16px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  #out { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 12px; }
  .q { border: 1px solid var(--line); border-radius: 6px; padding: 10px; margin: 8px 0; }
  .err { color: #8f1d1d; }
</style>
</head>
<body>
<h1>Masader</h1>
<p class="muted">Request an evidence-labelled brief. Every finding states how well it is supported and links to its sources. Reports are AI-generated; read the evidence before you rely on them.</p>
<form id="f">
  <label for="key">API key</label>
  <input id="key" type="password" autocomplete="off" required placeholder="rq_...">
  <label for="topic">Topic</label>
  <input id="topic" required minlength="3" maxlength="200" value="Commercial shipping through the Strait of Hormuz">
  <label for="question">Question</label>
  <textarea id="question" rows="2" required>What has happened to commercial shipping in the last 7 days, and how have Gulf and Indian officials responded?</textarea>
  <div class="row">
    <div><label for="from">From</label><input id="from" type="date" required value="2026-10-12"></div>
    <div><label for="to">To</label><input id="to" type="date" required value="2026-10-19"></div>
  </div>
  <label for="geo">Countries (ISO alpha-3, comma separated, optional)</label>
  <input id="geo" value="OMN, ARE, IND">
  <button type="submit">Request brief</button>
</form>
<div id="out" aria-live="polite"></div>
<script>
const out = document.getElementById("out");
const $ = (id) => document.getElementById(id);
function line(text, cls) { const p = document.createElement("p"); p.textContent = text; if (cls) p.className = cls; out.appendChild(p); return p; }
async function call(method, url, body, extra) {
  const r = await fetch(url, { method, headers: Object.assign({ "X-API-Key": $("key").value, "Content-Type": "application/json" }, extra || {}),
                               body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((data.error && data.error.message) || ("HTTP " + r.status));
  return data;
}
async function poll(reportId) {
  const p = line("Report " + reportId + ": queued");
  for (let i = 0; i < 600; i++) {
    const rep = await call("GET", "/v1/reports/" + reportId);
    const done = rep.stages.filter(s => s.status === "done").length;
    p.textContent = "Report " + reportId + ": " + rep.status + " (" + done + " of " + rep.stages.length + " stages done)";
    if (["delivered", "in_review", "failed"].includes(rep.status)) {
      if (rep.status !== "failed") {
        const r = await fetch("/v1/reports/" + reportId + ".html", { headers: { "X-API-Key": $("key").value } });
        const html = await r.text();
        const f = document.createElement("iframe");          // sandboxed: the brief runs no script
        f.setAttribute("sandbox", ""); f.srcdoc = html; f.title = "Brief " + reportId;
        f.style.cssText = "width:100%;height:80vh;border:1px solid #d9dde5;border-radius:6px;margin-top:8px";
        out.appendChild(f);
      }
      return;
    }
    await new Promise(res => setTimeout(res, 2000));
  }
}
function ask(res) {
  const box = document.createElement("div");
  line("A few questions first (defaults are preselected):");
  res.questions.forEach(q => {
    const d = document.createElement("div"); d.className = "q";
    const l = document.createElement("label"); l.textContent = q.text; d.appendChild(l);
    const s = document.createElement("select"); s.id = "ans_" + q.id;
    q.options.forEach(o => { const opt = document.createElement("option"); opt.value = o; opt.textContent = o.replaceAll("_", " "); if (o === q.default) opt.selected = true; s.appendChild(opt); });
    d.appendChild(s); box.appendChild(d);
  });
  const b = document.createElement("button"); b.textContent = "Send answers"; box.appendChild(b);
  out.appendChild(box);
  b.onclick = async () => {
    const answers = {}; res.questions.forEach(q => answers[q.id] = $("ans_" + q.id).value);
    try { const acc = await call("POST", res.answers_url, answers); box.remove(); poll(acc.report_id); }
    catch (e) { line(e.message, "err"); }
  };
}
$("f").onsubmit = async (ev) => {
  ev.preventDefault(); out.textContent = "";
  const geo = $("geo").value.split(",").map(s => s.trim().toUpperCase()).filter(Boolean);
  const body = { topic: $("topic").value, questions: [$("question").value], from: $("from").value, to: $("to").value, geography: geo };
  try {
    const res = await call("POST", "/v1/requests", body, { "Idempotency-Key": crypto.randomUUID() });
    if (res.status === "needs_clarification") ask(res); else poll(res.report_id);
  } catch (e) { line(e.message, "err"); }
};
</script>
</body>
</html>
