# Documentation site (GitHub Pages), built by .github/workflows/docs.yml. Local preview: `make docs-serve`.
site_name: Masader
site_description: Evidence-labelled research briefs (course implementation)
site_url: https://maryamrra90-create.github.io/masader/
repo_url: https://github.com/maryamrra90-create/masader
repo_name: maryamrra90-create/masader
edit_uri: ""
docs_dir: docs
site_dir: site
theme:
  name: material
  features: [navigation.sections, navigation.top, content.code.copy, search.highlight]
  palette:
    - scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }
markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.snippets: { base_path: ["."], check_paths: true }
  - pymdownx.superfences:
      custom_fences:
        - { name: mermaid, class: mermaid, format: !!python/name:pymdownx.superfences.fence_code_format }
nav:
  - Overview: index.md
  - Architecture: architecture.md
  - API reference: api-reference.md
  - Engineering toolchain: toolchain.md
  - Deviations from the architecture: deviations.md
  - Requirements traceability: traceability.md
  - Demo script: demo_script.md
  - AI-use declaration: declaration.md
