# CodeQL static analysis (GitHub code scanning) for the Python service, the demo recorder scripts and the
# workflow files themselves. Results appear under Security > Code scanning. Runs on every push and pull
# request to main and once a week, so new queries are applied to unchanged code too.
name: codeql
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule: [{ cron: "23 4 * * 1" }]
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write          # upload results to code scanning
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none            # interpreted languages: no build step needed
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
