# Release: pushing a tag v*, publishing a GitHub release, or running this workflow by hand (Actions > release >
# Run workflow, with a version) builds the image, publishes it to GitHub Container Registry
# (ghcr.io/maryamrra90-create/masader:<version> and :latest), records a signed build-provenance
# attestation and an SBOM attestation, and creates a GitHub release with the CycloneDX SBOM attached.
name: release
on:
  push: { tags: ["v*"] }
  release: { types: [published] }
  workflow_dispatch:
    inputs:
      version: { description: "Version to release, without the v (creates tag v<version> on this commit)", required: true, default: "1.0.0" }
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: write                 # create the GitHub release
      packages: write                 # push to ghcr.io
      id-token: write                 # keyless signing of attestations (Sigstore)
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: version from the tag, the release or the manual input
        env: { INPUT_VERSION: "${{ inputs.version }}", REF_NAME: "${{ github.ref_name }}", RELEASE_TAG: "${{ github.event.release.tag_name }}" }
        run: |
          v="${INPUT_VERSION:-${RELEASE_TAG:-$REF_NAME}}"; v="${v#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a semantic version: $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: install Trivy 0.76.1 (release binary, checksum verified)
        run: |
          curl -sSLf -o /tmp/trivy.tgz https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz
          echo "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0  /tmp/trivy.tgz" | sha256sum -c -
          tar xzf /tmp/trivy.tgz -C /tmp trivy
      - name: SBOM of the published image (CycloneDX JSON)
        run: /tmp/trivy image --format cyclonedx --output sbom.cdx.json "${IMAGE}@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
      - name: GitHub release with the SBOM
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", DIGEST: "${{ steps.build.outputs.digest }}" }
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" sbom.cdx.json --clobber
          else
            notes="Image: \`docker pull ${IMAGE}:${VERSION}\` (digest \`${DIGEST}\`).
          Verify provenance: \`gh attestation verify oci://${IMAGE}:${VERSION} --owner ${GITHUB_REPOSITORY_OWNER}\`.
          SBOM (CycloneDX) attached. Default run mode is simulated models; see the README."
            gh release create "$tag" sbom.cdx.json --target "$GITHUB_SHA" --title "Masader $tag" --notes "$notes"
          fi
