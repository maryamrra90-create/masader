# Release: pushing a tag v* builds the image, publishes it to GitHub Container Registry
# (ghcr.io/maryamrra90-create/masader:<version> and :latest), records a signed build-provenance
# attestation and an SBOM attestation, and creates a GitHub release with the CycloneDX SBOM attached.
name: release
on:
  push: { tags: ["v*"] }
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: write                 # create the GitHub release
      packages: write                 # push to ghcr.io
      id-token: write                 # keyless signing of attestations (Sigstore)
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: install Trivy 0.76.1 (release binary, checksum verified)
        run: |
          curl -sSLf -o /tmp/trivy.tgz https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz
          echo "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0  /tmp/trivy.tgz" | sha256sum -c -
          tar xzf /tmp/trivy.tgz -C /tmp trivy
      - name: SBOM of the published image (CycloneDX JSON)
        run: /tmp/trivy image --format cyclonedx --output sbom.cdx.json "${IMAGE}@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
      - name: GitHub release with the SBOM
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh release create "$GITHUB_REF_NAME" sbom.cdx.json --title "Masader $GITHUB_REF_NAME" --notes \
            "Image: \`docker pull ${IMAGE}:${GITHUB_REF_NAME#v}\` (digest \`${{ steps.build.outputs.digest }}\`).
          Verify provenance: \`gh attestation verify oci://${IMAGE}:${GITHUB_REF_NAME#v} --owner ${{ github.repository_owner }}\`.
          SBOM (CycloneDX) attached. Default run mode is simulated models; see the README."
