# Continuous integration for GitHub Actions: pre-commit hooks, lint, security scan, tests with a coverage floor,
# OpenAPI diff, image build, smoke test, Trivy image and config scan, and a CycloneDX SBOM. The same commands are run locally with make lint / security / cov.
name: ci
on: [push, pull_request]
jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install pre-commit==4.3.0
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pre-commit run --all-files --show-diff-on-failure
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: masader, POSTGRES_PASSWORD: masader, POSTGRES_DB: masader }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U masader" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://masader:masader@localhost:5432/masader
      REDIS_URL: redis://localhost:6379/0
      MODEL_MODE: simulated
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }            # full history, so the secret scan covers every commit
      - name: secret scan of the whole Git history (gitleaks)
        # The CLI scans every commit; gitleaks-action only scans the pushed range and fails on a first push.
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz -C /tmp gitleaks
          /tmp/gitleaks git --redact -v --exit-code 1 .
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check masader tests eval perf
      - name: security scan (fails on any bandit finding or known-vulnerable dependency)
        run: bandit -q -r masader && pip-audit -r requirements.txt
      - run: pytest -q --cov=masader --cov-report=term --cov-fail-under=80
      - run: python -m masader.cli openapi | diff - docs/openapi.v1.json
  image:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t masader:ci .
      - name: smoke-test the image (imports every worker dependency, runs the CLI)
        run: docker run --rm masader:ci sh -c "python -c 'import kombu.transport.redis, masader.pipeline.tasks' && masader --help"
      - name: install Trivy 0.76.1 (release binary, checksum verified)
        run: |
          curl -sSLf -o /tmp/trivy.tgz https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz
          echo "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0  /tmp/trivy.tgz" | sha256sum -c -
          tar xzf /tmp/trivy.tgz -C /tmp trivy
      - name: Trivy image scan (fails on any fixable HIGH or CRITICAL vulnerability, or a secret in the image)
        run: /tmp/trivy image --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 masader:ci
      - name: Trivy misconfiguration scan of the Dockerfile and Compose file
        run: /tmp/trivy config --severity HIGH,CRITICAL --exit-code 1 .
      - name: SBOM of the image (CycloneDX JSON)
        run: /tmp/trivy image --format cyclonedx --output sbom.cdx.json masader:ci
      - uses: actions/upload-artifact@v7
        with: { name: sbom-cyclonedx, path: sbom.cdx.json }
